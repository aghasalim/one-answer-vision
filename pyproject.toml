[project]
name = "oav"
version = "0.1.0"
description = "Point the camera, ask one question, get one short answer, offline."
requires-python = ">=3.11"
dependencies = ["pillow", "requests"]

[project.scripts]
oav = "oav.cli:main"

[tool.setuptools]
packages = ["oav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
